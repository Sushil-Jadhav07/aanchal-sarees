<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AANCHAL — 45 Look Inspector</title>
<style>body{margin:0;background:#faf3e8;color:#700c29;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font:36px Georgia}section{display:grid;grid-template-columns:1fr 330px;gap:24px}.stage{height:75vh;background:#e8d6be url('backgrounds/ivory-room.png') center/cover;display:flex;justify-content:center}.stage img{height:100%;max-width:100%;object-fit:contain}label{display:block;margin:20px 0}select,button{width:100%;padding:12px;font:inherit;color:inherit;background:#fff9f1;border:1px solid #c7a16a}small{display:block;line-height:1.6}#key{overflow-wrap:anywhere}@media(max-width:700px){section{grid-template-columns:1fr}.stage{height:60vh}}</style>
<main><h1>AANCHAL — combination inspector</h1><p>Prepared-image preview. Same reference pose; minor generated variations may remain.</p><section><div class="stage"><img id="model" alt="Selected outfit"></div><aside><label>Saree<select id="s"><option value="emerald">Emerald</option><option value="magenta">Magenta</option><option value="mustard">Mustard</option><option value="ruby">Ruby</option><option value="navy">Navy</option></select></label><label>Blouse<select id="b"><option value="gold">Gold</option><option value="emerald">Emerald</option><option value="ivory">Ivory</option></select></label><label>Earrings<select id="e"><option value="jhumkas">Gold jhumkas</option><option value="pearl">Pearl drops</option><option value="temple">Temple earrings</option></select></label><p id="key"></p><p id="status" role="status"></p><button id="reset">Reset</button><p><small>All 45 combinations included. This inspector does not simulate fit, size or checkout.</small></p></aside></section></main>
<script>const s=document.querySelector('#s'),b=document.querySelector('#b'),e=document.querySelector('#e'),m=document.querySelector('#model'),status=document.querySelector('#status');let request=0;function update(){const k=[s.value,b.value,e.value].join('__');document.querySelector('#key').textContent=k;status.textContent='Loading…';const n=++request,p=new Image();p.onload=()=>{if(n!==request)return;m.src=p.src;status.textContent='Preview loaded';m.alt=`${s.value} saree, ${b.value} blouse, ${e.value} earrings`;};p.onerror=()=>{if(n===request)status.textContent='Image could not load — check extracted folder.'};p.src='looks/'+k+'.webp'}[s,b,e].forEach(x=>x.addEventListener('change',update));document.querySelector('#reset').onclick=()=>{s.value='emerald';b.value='gold';e.value='jhumkas';update()};update();</script>
